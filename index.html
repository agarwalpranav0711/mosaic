<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Name a planet in the Mandelbrot set and fall into it.">
  <title>Fall into your planet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+SC:wght@400;600&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --page: #000000;
      --ink: #f2f2f2;
      --quiet: #999999;
      --accent: #c9c9c9;
      font-family: "DM Sans", "Noto Sans", sans-serif;
      background: var(--page);
      color: var(--ink);
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-width: 320px; height: 100%; margin: 0; overflow: hidden; background: #000000; }

    body {
      min-height: 100svh;
      font-family: "DM Sans", "Noto Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    #app { position: relative; width: 100%; height: 100svh; min-height: 100%; isolation: isolate; background: #000000; }

    #ambient-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.38;
      transition: opacity 600ms ease;
    }

    #ambient-satellites {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .drift-satellite {
      position: absolute;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      pointer-events: none;
      user-select: none;
      animation: drift-across linear infinite;
      animation-duration: var(--drift-dur, 48s);
      animation-delay: var(--drift-delay, 0s);
      top: var(--drift-y, 10%);
      transform-origin: center center;
    }
    .drift-planet {
      border-radius: 50%;
      box-shadow: 0 0 14px -2px rgba(255, 255, 255, 0.2);
      display: block;
    }
    .drift-name {
      font-family: "DM Sans", "Noto Sans", sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.45);
      white-space: nowrap;
    }

    @keyframes drift-across {
      0% {
        transform: translate3d(-140px, 0, 0) scale(var(--drift-scale, 0.6));
        opacity: 0;
      }
      6% {
        opacity: var(--drift-opacity, 0.65);
      }
      92% {
        opacity: var(--drift-opacity, 0.65);
      }
      100% {
        transform: translate3d(calc(100vw + 140px), 0, 0) scale(var(--drift-scale, 0.6));
        opacity: 0;
      }
    }

    #flight {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }

    #point {
      position: absolute;
      left: 50%;
      top: 26%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent, #c9c9c9);
      box-shadow: 0 0 10px 3px rgba(255, 255, 255, .35);
      transform: translate(-50%, -50%);
      animation: breathe 3.8s ease-in-out infinite;
      transition: background-color 300ms ease, box-shadow 300ms ease, opacity 350ms ease;
      z-index: 5;
    }

    #preview-planet {
      position: absolute;
      left: 50%;
      top: 26%;
      width: clamp(80px, 13vw, 110px);
      height: clamp(80px, 13vw, 110px);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 0 28px -2px var(--accent-glow, rgba(200, 200, 200, 0.25));
      transition: opacity 400ms cubic-bezier(0.16, 1, 0.3, 1), transform 400ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 400ms ease;
      z-index: 5;
    }
    #preview-planet.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #entry, #gathering, #landing, #error-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: max(28px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
    }

    #entry { gap: 28px; }
    #invitation { margin: 0; color: #b8b8b8; font-size: clamp(16px, 3.5vw, 19px); font-weight: 400; letter-spacing: -0.01em; }

    #name-control {
      position: relative;
      z-index: 1;
      width: min(92vw, 760px);
      min-height: 1.6em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #name-display {
      display: block;
      width: 100%;
      min-height: 1.3em;
      pointer-events: none !important;
      user-select: none;
      color: var(--ink);
      font-family: "Noto Sans", "Noto Sans Devanagari", "Noto Sans Arabic", "Noto Sans SC", "DM Sans", sans-serif;
      font-size: clamp(38px, 9vw, 84px);
      font-weight: 400;
      line-height: 1.25;
      text-align: center;
      word-break: break-word;
      overflow-wrap: anywhere;
      unicode-bidi: plaintext;
      padding-bottom: 6px;
    }
    #name-display:empty::before {
      content: "Name your planet";
      color: rgba(255, 255, 255, 0.22);
      font-weight: 300;
      pointer-events: none;
    }

    #planet-name {
      position: absolute;
      z-index: 2;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 2px;
      padding: 0;
      background: transparent;
      color: transparent;
      caret-color: var(--accent);
      opacity: 0;
      pointer-events: auto;
      text-align: center;
      font-size: clamp(38px, 9vw, 84px);
      outline: none;
    }

    #name-underline {
      display: block;
      width: min(280px, 75%);
      height: 2px;
      margin: 14px auto 0;
      background: var(--accent);
      border-radius: 1px;
      opacity: 0.35;
      transition: opacity 250ms ease, background-color 300ms ease, width 250ms ease;
      pointer-events: none;
    }
    #name-control:focus-within #name-underline {
      opacity: 0.9;
      width: min(380px, 90%);
    }
    #name-control.invalid { animation: nudge 280ms ease-out; }

    #entry-action {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    #start-button {
      position: relative;
      z-index: 11;
      min-height: 48px;
      height: 48px;
      padding: 0 36px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
      background: #111216;
      color: #f0f0f0;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 2px 10px rgba(0, 0, 0, 0.7), 0 0 18px -4px var(--accent-glow, rgba(200, 200, 200, 0.2));
      transition: background-color 200ms ease, border-color 250ms ease, box-shadow 250ms ease, transform 150ms ease, opacity 200ms ease;
    }
    #start-button:hover {
      background: #181920;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 4px 16px rgba(0, 0, 0, 0.8), 0 0 22px -2px var(--accent-glow, rgba(200, 200, 200, 0.35));
    }
    #start-button:active {
      transform: scale(0.98);
      background: #0f1013;
    }
    #start-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }
    #start-button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #sound-toggle {
      position: absolute;
      z-index: 20;
      top: max(20px, calc(env(safe-area-inset-top) + 12px));
      right: max(20px, calc(env(safe-area-inset-right) + 12px));
      min-width: 44px;
      min-height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9999px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.4);
      color: #8e8e8e;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      transition: border-color 200ms ease, color 200ms ease;
    }
    #sound-toggle:hover {
      border-color: rgba(255, 255, 255, 0.35);
      color: #d0d0d0;
    }
    #sound-toggle:focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; }

    #gathering, #landing, #error-state { display: none; }
    #gathering { gap: 24px; }
    #gathering-particles {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 1px;
      height: 1px;
      overflow: visible;
      pointer-events: none;
    }
    .letter-particle {
      position: absolute;
      left: 0;
      top: 0;
      color: var(--accent);
      font-family: "Noto Sans", "Noto Sans Devanagari", "Noto Sans Arabic", "Noto Sans SC", "DM Sans", sans-serif;
      font-size: clamp(24px, 6vw, 48px);
      font-weight: 400;
      transform: translate(var(--from-x), var(--from-y));
      animation: gather-drift 1.2s cubic-bezier(0.25, 0.1, 0.25, 1) both;
      animation-delay: var(--delay);
    }
    #gathering-message, #status-message { margin: 0; color: var(--quiet); font-size: 14px; }
    #gathering-message { position: absolute; top: calc(48% + 56px); }

    #landing {
      gap: 6px;
      justify-content: center;
      opacity: 0;
      transition: opacity 400ms ease-out;
    }
    #landing.visible { opacity: 1; }
    #planet-portrait {
      display: block;
      width: min(92vw, 52svh, 640px);
      height: auto;
      aspect-ratio: 1;
      object-fit: contain;
      background: transparent;
    }
    #landing.visible #planet-portrait {
      animation: halo-ignite 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    #landing-name {
      max-width: 92vw;
      margin: 2px 0 12px;
      color: var(--ink);
      font-family: "Noto Sans", "Noto Sans Devanagari", "Noto Sans Arabic", "Noto Sans SC", "DM Sans", sans-serif;
      font-size: clamp(28px, 6vw, 44px);
      font-weight: 400;
      line-height: 1.25;
      overflow-wrap: anywhere;
      unicode-bidi: plaintext;
    }
    #landing.visible #landing-name {
      opacity: 0;
      animation: name-arrive 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
    }

    #landing-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
    }
    #landing.visible #landing-actions {
      opacity: 0;
      animation: actions-arrive 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both;
    }

    #save-button {
      min-height: 48px;
      height: 48px;
      min-width: 200px;
      padding: 0 32px;
      border: 1px solid transparent;
      border-radius: 9999px;
      background: var(--accent);
      color: #05070a;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: filter 200ms ease, transform 150ms ease;
    }
    #save-button:hover { filter: brightness(1.1); }
    #save-button:active { transform: scale(0.98); }
    #save-button:focus-visible { outline: 2px solid #ffffff; outline-offset: 4px; }

    #again-button {
      min-height: 48px;
      height: 48px;
      min-width: 200px;
      padding: 0 32px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 9999px;
      background: transparent;
      color: #e2e2e2;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 200ms ease, color 200ms ease, transform 150ms ease;
    }
    #again-button:hover {
      border-color: rgba(255, 255, 255, 0.55);
      color: #ffffff;
    }
    #again-button:active { transform: scale(0.98); }
    #again-button:focus-visible { outline: 2px solid #ffffff; outline-offset: 4px; }

    #error-state { gap: 14px; }
    #error-title { margin: 0; color: var(--ink); font-size: 20px; font-weight: 500; }
    #error-message { max-width: 34ch; margin: 0; color: var(--quiet); line-height: 1.6; }
    #restart-button {
      min-height: 48px;
      height: 48px;
      padding: 0 28px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 9999px;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }
    #restart-button:hover { border-color: #ffffff; }
    #restart-button:focus-visible { outline: 2px solid #ffffff; outline-offset: 4px; }

    #status-message {
      margin: 0;
      min-height: 1.2em;
      text-align: center;
      pointer-events: none;
      font-size: 13px;
    }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @keyframes breathe {
      0%, 100% { opacity: .45; transform: translate(-50%, -50%) scale(.8); }
      50% { opacity: .95; transform: translate(-50%, -50%) scale(1.25); }
    }
    @keyframes gather-drift {
      0% {
        opacity: 1;
        transform: translate(var(--from-x), var(--from-y)) scale(1);
        filter: none;
      }
      35% {
        opacity: 0.9;
        filter: blur(1px) drop-shadow(0 0 4px var(--accent));
      }
      80% {
        opacity: 0.8;
        transform: translate(calc(var(--to-x) * 0.8), calc(var(--to-y) * 0.8)) scale(0.25);
        filter: blur(0px) drop-shadow(0 0 6px var(--accent));
      }
      100% {
        opacity: 0;
        transform: translate(var(--to-x), var(--to-y)) scale(0.08);
        filter: blur(0px);
      }
    }
    @keyframes halo-ignite {
      0% {
        transform: scale(0.92);
        filter: drop-shadow(0 0 0px var(--accent)) brightness(1.2);
        opacity: 0.2;
      }
      40% {
        filter: drop-shadow(0 0 28px var(--accent)) brightness(1.35);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.15)) brightness(1);
        opacity: 1;
      }
    }
    @keyframes name-arrive {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes actions-arrive {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes nudge { 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }

    @media (max-width: 420px) {
      #entry { gap: 20px; }
      #planet-portrait { width: min(92vw, 49svh); }
      #landing-name { margin-bottom: 8px; }
      #landing-actions { margin-top: 10px; gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
      #landing { transition: opacity 250ms linear !important; }
      #landing.visible #planet-portrait,
      #landing.visible #landing-name,
      #landing.visible #landing-actions {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
      #point { transition: none !important; }
      #ambient-canvas { animation: none !important; }
      #ambient-satellites { display: none !important; }
      #preview-planet { transition: none !important; }
    }
  </style>
</head>
<body>
  <main id="app">
    <canvas id="ambient-canvas" aria-hidden="true"></canvas>
    <div id="ambient-satellites" aria-hidden="true"></div>
    <canvas id="flight" aria-hidden="true"></canvas>
    <span id="point" aria-hidden="true"></span>
    <canvas id="preview-planet" width="192" height="192" aria-hidden="true"></canvas>
    <button id="sound-toggle" type="button" aria-pressed="false" aria-label="Turn sound on">Sound off</button>

    <form id="entry">
      <p id="invitation">Give the dark a name.</p>
      <div id="name-control">
        <span id="name-display" aria-hidden="true"></span>
        <label class="visually-hidden" for="planet-name">Your planet's name, up to 40 characters</label>
        <input id="planet-name" type="text" maxlength="40" autocomplete="off" autocapitalize="off" aria-describedby="status-message">
        <div id="name-underline" aria-hidden="true"></div>
      </div>
      <div id="entry-action">
        <button id="start-button" type="submit">Fall into your planet</button>
        <p id="status-message" role="status" aria-live="polite"></p>
      </div>
    </form>

    <section id="gathering" aria-live="polite" aria-hidden="true">
      <div id="gathering-particles" aria-hidden="true"></div>
      <p id="gathering-message">Finding your planet.</p>
    </section>

    <section id="landing" aria-hidden="true">
      <canvas id="planet-portrait" aria-label="Your rendered planet"></canvas>
      <p id="landing-name"></p>
      <div id="landing-actions">
        <button id="save-button" type="button">Save my planet</button>
        <button id="again-button" type="button">Try another name</button>
      </div>
    </section>

    <section id="error-state" role="alert" aria-hidden="true">
      <h1 id="error-title">The dive stopped.</h1>
      <p id="error-message"></p>
      <button id="restart-button" type="button">Retry this dive</button>
    </section>
  </main>
  <script type="module" src="/src/divePage.ts"></script>
</body>
</html>
