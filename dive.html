<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Name a planet in the Mandelbrot set and fall into it.">
  <title>Fall into your planet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+SC:wght@400;600&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --page: #000000;
      --ink: #f2f2f2;
      --quiet: #999999;
      --accent: #bdbdbd;
      font-family: "DM Sans", "Noto Sans", sans-serif;
      background: var(--page);
      color: var(--ink);
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-width: 320px; height: 100%; margin: 0; overflow: hidden; background: #000000; }

    body {
      min-height: 100svh;
      font-family: "DM Sans", "Noto Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    #app { position: relative; width: 100%; height: 100svh; min-height: 100%; isolation: isolate; background: #000000; }

    #flight {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      opacity: 0;
      pointer-events: none;
    }

    #point {
      position: absolute;
      left: 50%;
      top: 32%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #c9c9c9;
      box-shadow: 0 0 7px 1px rgba(255, 255, 255, .24);
      transform: translate(-50%, -50%);
      animation: breathe 3.8s ease-in-out infinite;
    }

    #entry, #gathering, #landing, #error-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    }

    #entry { gap: 22px; }
    #invitation { margin: 0; color: #d2d2d2; font-size: clamp(17px, 4vw, 20px); font-weight: 400; }
    #name-control {
      position: relative;
      z-index: 1;
      width: min(100%, 720px);
      min-height: 1.5em;
      overflow: hidden;
    }
    #name-display {
      display: block;
      min-height: 1.25em;
      pointer-events: none !important;
      user-select: none;
      color: var(--ink);
      font-family: "Noto Sans", "Noto Sans Devanagari", "Noto Sans Arabic", "Noto Sans SC", sans-serif;
      font-size: clamp(42px, 12vw, 104px);
      font-weight: 400;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    #planet-name {
      position: absolute;
      z-index: 2;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 2px;
      padding: 0;
      background: transparent;
      color: transparent;
      caret-color: var(--accent);
      opacity: 0;
      pointer-events: auto;
      text-align: center;
      font-size: clamp(42px, 12vw, 104px);
      outline: none;
    }

    #name-control:focus-within #name-display {
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-decoration-thickness: 2px;
      text-underline-offset: 10px;
    }
    #name-control.invalid { animation: nudge 280ms ease-out; }

    #entry-action {
      position: relative;
      z-index: 10;
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
    }
    #start-button, #save-button, #again-button, #sound-toggle, #restart-button {
      position: relative;
      z-index: 11;
      min-height: 48px;
      border: 1px solid transparent;
      border-radius: 3px;
      padding: 11px 18px;
      background: transparent;
      color: var(--accent);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    #start-button:hover, #save-button:hover, #again-button:hover, #restart-button:hover {
      border-color: var(--accent);
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    #sound-toggle {
      position: absolute;
      z-index: 4;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      min-width: 48px;
      border-color: transparent;
      padding: 10px 12px;
      color: #bdbdbd;
      font-size: 13px;
    }

    #gathering, #landing, #error-state { display: none; }
    #gathering { gap: 24px; }
    #gathering-particles {
      position: absolute;
      left: 50%;
      top: 43%;
      width: 1px;
      height: 1px;
      overflow: visible;
    }
    .letter-particle {
      position: absolute;
      left: 0;
      top: 0;
      color: var(--accent);
      font-family: "Noto Sans", "Noto Sans Devanagari", "Noto Sans Arabic", "Noto Sans SC", sans-serif;
      font-size: clamp(28px, 7vw, 56px);
      transform: translate(var(--from-x), var(--from-y));
      animation: gather 1.2s cubic-bezier(.35, 0, .2, 1) both;
      animation-delay: var(--delay);
    }
    #gathering-message, #status-message { margin: 0; color: var(--quiet); font-size: 14px; }
    #gathering-message { position: absolute; top: calc(43% + 36px); }

    #landing { gap: 4px; justify-content: center; }
    #landing { opacity: 0; transition: opacity 650ms ease-out; }
    #landing.visible { opacity: 1; }
    #planet-portrait {
      display: block;
      width: min(94vw, 54svh, 680px);
      height: auto;
      aspect-ratio: 1;
      object-fit: contain;
    }
    #landing-name {
      max-width: 92vw;
      margin: -4px 0 10px;
      color: var(--ink);
      font-family: "Noto Sans", "Noto Sans Devanagari", "Noto Sans Arabic", "Noto Sans SC", sans-serif;
      font-size: clamp(30px, 7vw, 48px);
      font-weight: 400;
      line-height: 1.2;
      overflow-wrap: anywhere;
      opacity: 0;
      animation: arrive 700ms ease-out 120ms forwards;
    }
    #landing-actions { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    #landing-actions button { min-width: 188px; }

    #error-state { gap: 14px; }
    #error-title { margin: 0; color: var(--ink); font-size: 20px; font-weight: 500; }
    #error-message { max-width: 34ch; margin: 0; color: var(--quiet); line-height: 1.6; }
    #restart-button { border-color: var(--accent); }
    #status-message { position: absolute; left: 24px; right: 24px; bottom: max(12px, env(safe-area-inset-bottom)); text-align: center; pointer-events: none; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @keyframes breathe { 0%, 100% { opacity: .45; transform: translate(-50%, -50%) scale(.8); } 50% { opacity: .95; transform: translate(-50%, -50%) scale(1.25); } }
    @keyframes gather { 0% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--to-x)), calc(-50% + var(--to-y))) scale(.18); } }
    @keyframes arrive { to { opacity: 1; } }
    @keyframes nudge { 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
    @media (max-width: 420px) {
      #entry { gap: 18px; }
      #planet-portrait { width: min(94vw, 51svh); }
      #landing { gap: 0; }
      #landing-name { margin-top: -2px; }
    }
    @media (min-width: 900px) {
      #entry { gap: 25px; }
      #planet-portrait { width: min(54svh, 680px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      #landing { transition: opacity 250ms linear !important; }
    }
  </style>
</head>
<body>
  <main id="app">
    <canvas id="flight" aria-hidden="true"></canvas>
    <span id="point" aria-hidden="true"></span>
    <button id="sound-toggle" type="button" aria-pressed="false" aria-label="Sound off">Sound off</button>

    <form id="entry">
      <p id="invitation">Give the dark a name.</p>
      <div id="name-control">
        <span id="name-display" aria-hidden="true"></span>
        <label class="visually-hidden" for="planet-name">Your planet's name, up to 40 characters</label>
        <input id="planet-name" type="text" maxlength="160" autocomplete="off" autocapitalize="off" aria-describedby="status-message">
      </div>
      <div id="entry-action">
        <button id="start-button" type="submit">Fall into your planet</button>
        <p id="status-message" role="status" aria-live="polite"></p>
      </div>
    </form>

    <section id="gathering" aria-live="polite" aria-hidden="true">
      <div id="gathering-particles" aria-hidden="true"></div>
      <p id="gathering-message">Finding your planet.</p>
    </section>

    <section id="landing" aria-hidden="true">
      <canvas id="planet-portrait" aria-label="Your rendered planet"></canvas>
      <p id="landing-name"></p>
      <div id="landing-actions">
        <button id="save-button" type="button">Save my planet</button>
        <button id="again-button" type="button">Try another name</button>
      </div>
    </section>

    <section id="error-state" role="alert" aria-hidden="true">
      <h1 id="error-title">The dive stopped.</h1>
      <p id="error-message"></p>
      <button id="restart-button" type="button">Retry this dive</button>
    </section>
  </main>
  <script type="module" src="/src/divePage.ts"></script>
</body>
</html>
